services:
  - type: web
    name: kyb-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APIFY_API_TOKEN
        sync: false
      - key: API_KEYS
        sync: false
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
